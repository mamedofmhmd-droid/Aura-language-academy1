version: "3.9"
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: aura_user
      POSTGRES_PASSWORD: strong_password
      POSTGRES_DB: aura_georgian
    volumes:
      - pg_data:/var/lib/postgresql/data

  api:
    build: ./backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://aura_user:strong_password@db:5432/aura_georgian?schema=public
      JWT_SECRET: change_me_to_long_random_secret
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "4000:4000"

  web:
    image: nginx:alpine
    restart: always
    depends_on:
      - api
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

volumes:
  pg_data:
